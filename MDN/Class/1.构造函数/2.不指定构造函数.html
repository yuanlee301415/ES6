<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>不指定构造函数</title>
</head>
<body>

</body>
<script>
    /**
     * 如果你的类是派生类，默认构造函数会调用父构造函数，并传递所提供的任何参数
     */
        
    // ValidationError 类不需要显式构造函数，因为它不需要进行任何自定义初始化。默认构造函数会根据给定的参数初始化父类 Error 。
    class ValidationError extends Error {
        printCustomerMessage() {
            console.error(`[验证失败]：`, this.message)
        }
    }
    new ValidationError('手机号格式错误！').printCustomerMessage()


    /**
     * 如果你提供了自己的构造函数，而你的类派生自某个父类，那么你必须使用 super() 显式地调用父类的构造函数。
     */
    
    class ValidationError2 extends Error {
        constructor(message) {
            super(message);
            this.name = 'ValidationError2'
            this.code = 42
        }
        printCustomerMessage() {
            console.error(`[验证失败]：错误信息：${this.message}，错误代码：${this.code}，错误名称：${this.name}`)
        }
    }
    new ValidationError2('邮箱格式错误！').printCustomerMessage()
    
</script>
</html>
