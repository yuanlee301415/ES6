<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>返回值</title>
</head>
<body>

</body>
<script>
    /**
     * 基类可以在构造函数中返回任何值
     */
    
    class Parent {
        constructor() {
            return 1 // 因为返回值不是一个对象，所以它会被忽略
        }
    }
    console.log(new Parent())
    

    /**
     * 派生类必须返回一个对象、 undefined 值，否则抛出 TypeError 
     */

    try {
        class Child extends Parent {
            constructor() {
                super();
                return 1
            }
        }
        console.log(new Child())
    } catch (e) {
        console.error(e) // Uncaught TypeError: Derived constructors may only return object or undefined 
    }
    
</script>
</html>
